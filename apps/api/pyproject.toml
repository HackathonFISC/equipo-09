[project]
name = "puente-api"
version = "0.1.0"
description = "Puente: sistema agéntico de inserción laboral juvenil (Reto 3, Hackathon FISC 2026)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "scalar-fastapi>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puente_api"]
