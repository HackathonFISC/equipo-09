[project]
name = "puente-api"
version = "0.1.0"
description = "Puente: sistema agéntico de inserción laboral juvenil (Reto 3, Hackathon FISC 2026)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "scalar-fastapi>=1.0",
  "sqlalchemy>=2.0",
  "litellm>=1.50",
  "pydantic-settings>=2.4",
  "ortools>=9.15.6755",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puente_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
