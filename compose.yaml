# Puente en Docker Compose: postgres + api + web.
#   cp .env.example .env    # pon tu LLM_API_KEY (o la variable estándar del proveedor)
#   docker compose up --build
# Web: http://localhost:3001 · API: http://localhost:8000/docs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: puente
      POSTGRES_PASSWORD: puente
      POSTGRES_DB: puente
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puente -d puente"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      # Estos valores pisan los de .env (que apuntan a SQLite local).
      DATABASE_URL: postgresql+psycopg://puente:puente@postgres:5432/puente
      CHECKPOINT_PATH: /data/checkpoints.sqlite
      LLM_CACHE_DIR: /data/llm-cache
      CORS_ORIGINS: '["http://localhost:3001"]'
    volumes:
      - apidata:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # La usa el NAVEGADOR: por eso es localhost (el puerto publicado de la api).
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_API_MOCKS: nunca
    environment:
      # La usan los Server Components DENTRO de la red de Docker.
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  apidata:
